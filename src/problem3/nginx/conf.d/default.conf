log_format upstream_timing '$remote_addr [$time_local] "$request" $status '
                           'rt=$request_time urt=$upstream_response_time '
                           'upstream=$upstream_addr ustatus=$upstream_status rid=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream_timing;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx re-resolve
    # the name, so a recreated api container (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /status {
        proxy_pass $api_upstream;
    }

    location = /ready {
        proxy_pass $api_upstream;
    }
}
