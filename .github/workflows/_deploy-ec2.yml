name: deploy-ec2

# Settings come from GitHub environment variables (AWS_DEPLOY_ROLE_ARN,
# TARGET_GROUP_ARN, BACKEND_URL). Without AWS_DEPLOY_ROLE_ARN the rollout runs
# as a dry run and prints the AWS calls it would make. The signature and
# provenance checks run in every mode. The 60-minute limit covers four instances
# at rollout.sh's worst case of about 15 minutes each.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        description: Digest reference of the image to roll out
        required: true
        type: string
      app-tag:
        description: Value of the App tag on the target instances, also the image name
        required: false
        type: string
        default: p4-backend

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.app-tag }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' && '1' || '0' }}
      IMAGE: ${{ inputs.image }}
      SIGNER_REGEXP: ^https://github.com/${{ github.repository }}/\.github/workflows/_container\.yml@refs/heads/main$
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the image reference
        env:
          APP_TAG: ${{ inputs.app-tag }}
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::image must be a digest reference, got '$IMAGE'"; exit 1; }
          [[ "${IMAGE%@*}" == */"$APP_TAG" ]] \
            || { echo "::error::image name must be $APP_TAG"; exit 1; }

      - name: Log in to GHCR
        if: startsWith(inputs.image, 'ghcr.io/')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Assume the deploy role
        if: env.DRY_RUN == '0'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to ECR
        if: env.DRY_RUN == '0' && contains(inputs.image, '.amazonaws.com/')
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$SIGNER_REGEXP" "$IMAGE" >/dev/null
          gh attestation verify "oci://$IMAGE" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/_container.yml"
          echo "signature and provenance verified for $IMAGE"

      - name: Read the image revision
        id: revision
        run: |
          revision=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          [ -n "$revision" ] || { echo "::error::the image carries no revision label"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Roll out
        env:
          APP_TAG: ${{ inputs.app-tag }}
          ENV_NAME: ${{ inputs.environment }}
          TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN || 'arn:aws:elasticloadbalancing:<region>:<account>:targetgroup/<name>/<id>' }}
          COSIGN_IDENTITY_REGEXP: ${{ env.SIGNER_REGEXP }}
          DRAINED_FILE: drained-target
        run: src/problem4/backend/deploy/rollout.sh 2>&1 | tee rollout.log

      - name: Register a drained instance again
        if: always() && env.DRY_RUN == '0'
        env:
          TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
        run: |
          target=$(cat drained-target 2>/dev/null || true)
          if [ -n "$target" ]; then
            aws elbv2 register-targets --target-group-arn "$TARGET_GROUP_ARN" --targets "$target"
            echo "::warning::the rollout stopped with $target drained; it is registered again"
          fi

      - name: Smoke test
        if: env.DRY_RUN == '0'
        env:
          URL: ${{ vars.BACKEND_URL }}
          EXPECTED: ${{ steps.revision.outputs.revision }}
        run: |
          curl -fsS --retry 5 --retry-all-errors "$URL/healthz"
          served=$(curl -fsS "$URL/api/version" | jq -r .version)
          [ "$served" = "$EXPECTED" ] || { echo "::error::serving $served, expected $EXPECTED"; exit 1; }

      - name: Summary
        if: always()
        env:
          ENV_NAME: ${{ inputs.environment }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          {
            echo "### Backend → $ENV_NAME"
            echo "Image: \`$IMAGE\` (revision \`$REVISION\`)"
            if [ "$DRY_RUN" = 1 ]; then echo "Dry run: AWS_DEPLOY_ROLE_ARN is not set for this environment."; fi
            echo '```text'
            cat rollout.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
