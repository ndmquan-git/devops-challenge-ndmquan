name: node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding package.json and package-lock.json
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "26"
      build:
        description: Run `npm run build`
        required: false
        type: boolean
        default: false
      artifact-name:
        description: Upload artifact-path under this name; empty skips the upload
        required: false
        type: string
        default: ""
      artifact-path:
        required: false
        type: string
        default: dist

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - if: inputs.build
        run: npm run build

      - if: inputs.artifact-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 30
