name: container

# build runs with no credentials: lint, build, scan. publish runs only when the
# caller sets push and grants packages: write, id-token: write and
# attestations: write; it pushes by digest, signs keylessly and attests
# provenance. The registry is ECR when vars.ECR_REGISTRY and
# vars.AWS_ECR_ROLE_ARN are set, otherwise this repository's GHCR namespace.
on:
  workflow_call:
    inputs:
      context:
        description: Build context holding the Dockerfile
        required: true
        type: string
      image-name:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false
      build-args:
        required: false
        type: string
        default: ""
    outputs:
      image:
        description: Digest reference of the published image; empty when not pushed
        value: ${{ jobs.publish.outputs.image }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      registry:
        value: ${{ jobs.publish.outputs.registry }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_TAG: local/${{ inputs.image-name }}:${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/Dockerfile

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ env.LOCAL_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image
        if: inputs.push
        run: docker save "$LOCAL_TAG" | gzip > image.tgz

      - name: Upload image
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.image-name }}
          path: image.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      registry: ${{ steps.registry.outputs.registry }}
    env:
      LOCAL_TAG: local/${{ inputs.image-name }}:${{ github.sha }}
    steps:
      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ inputs.image-name }}

      - name: Load image
        run: docker load -i image.tgz

      - name: Choose registry
        id: registry
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_ROLE: ${{ vars.AWS_ECR_ROLE_ARN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$ECR_REGISTRY" ] && [ -n "$ECR_ROLE" ]; then
            echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
            echo "kind=ecr" >> "$GITHUB_OUTPUT"
          else
            echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
            echo "kind=ghcr" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume the ECR role
        if: steps.registry.outputs.kind == 'ecr'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to ECR
        if: steps.registry.outputs.kind == 'ecr'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Log in to GHCR
        if: steps.registry.outputs.kind == 'ghcr'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push by digest
        id: push
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          NAME: ${{ inputs.image-name }}
          SHA: ${{ github.sha }}
        run: |
          docker tag "$LOCAL_TAG" "$REGISTRY/$NAME:$SHA"
          docker push "$REGISTRY/$NAME:$SHA"
          digest=$(docker buildx imagetools inspect "$REGISTRY/$NAME:$SHA" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$NAME@$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: ${{ steps.registry.outputs.kind == 'ghcr' }}

      - name: Summary
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          {
            echo "### Published"
            echo "\`$IMAGE\`"
            echo "Signed with a keyless certificate for this workflow; provenance attested."
          } >> "$GITHUB_STEP_SUMMARY"
